[platformio]
default_envs = esp32dev
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<SdKfz222.cpp> -<servo_test/>
lib_deps =
  madhephaestus/ESP32Servo
  h2zero/NimBLE-Arduino
  pololu/VL53L1X
monitor_speed = 115200

[env:servo_test]
extends = env:esp32dev
build_src_filter = +<servo_test/servo_test.cpp>
